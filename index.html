<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Something thoughtful is on its way." />
    <title>Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero">
      <div class="orb orb-one"></div>
      <div class="orb orb-two"></div>
      <section class="content" aria-labelledby="page-title">
        <p class="eyebrow"><span></span> A new experience is taking shape</p>
        <h1 id="page-title">Something beautiful<br />is coming soon.</h1>
        <p class="intro">We’re putting the finishing touches on a place made with care. Join the list and be the first to know when we open our doors.</p>
        <form class="signup" action="#" method="post">
          <label class="sr-only" for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="Your email address" autocomplete="email" required />
          <button type="submit">Notify me <span aria-hidden="true">→</span></button>
        </form>
        <p class="form-note">No noise, ever. Just one note when we’re ready.</p>
      </section>
      <footer>
        <span>© <span id="year"></span> All rights reserved.</span>
        <a href="mailto:hello@example.com">Say hello</a>
      </footer>
    </main>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  </body>
</html>
